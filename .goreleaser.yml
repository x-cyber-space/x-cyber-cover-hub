# GoReleaser configuration — https://goreleaser.com
#
# Validate with:  goreleaser check
# Dry run with:   goreleaser release --snapshot --clean
version: 2

project_name: x-cyber-cover-hub

# Deliberately no `go mod tidy` hook: a release must build exactly what the tag
# points at, and tidy can rewrite go.mod mid-release.

builds:
  - id: x-cyber-cover-hub
    main: ./cmd/server
    binary: x-cyber-cover-hub
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - docs/SPEC.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore"
      - "^Merge pull request"

release:
  draft: true
  prerelease: auto
  footer: |
    **Full changelog**: https://github.com/x-cyber-space/x-cyber-cover-hub/compare/{{ .PreviousTag }}...{{ .Tag }}
