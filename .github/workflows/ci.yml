name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A new push to a pull request makes the previous run pointless, so cancel it.
# Runs on main are left alone so the branch always has a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to no write access; jobs opt in to what they need.
permissions:
  contents: read

jobs:
  test:
    name: build, vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Reuse the Makefile targets so CI and a local run cannot drift apart.
      - name: Verify gofmt
        run: make fmt-check

      - name: Build
        run: go build ./...

      - name: Vet
        run: make vet

      # -short keeps the live-provider smoke test out of CI: it depends on four
      # third-party music platforms and would make the build flaky.
      - name: Test
        run: go test -short -race -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # v2 of the linter is required by the .golangci.yml schema. Pinning the
      # linter version stops a new release from turning the build red on its own.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout 5m

  cross-compile:
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The project's selling point is a single static binary with no CGO, so
      # every release target must actually build.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/server

  container:
    name: build and run container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # `push: false` and `load: true`: a pull request must be able to prove the
      # Dockerfile still builds, without being able to publish anything. Dependabot
      # raises base-image bumps regularly, and nothing else in CI touches the
      # Dockerfile.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: x-cyber-cover-hub:ci
          build-args: |
            VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building is not the same as running. This Dockerfile once shipped
      # without the COPY that places the binary in the runtime stage: the build
      # succeeded and the container died on start with "no such file or
      # directory". So start it and talk to it.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker run -d --name cover-ci -p 3400:3400 x-cyber-cover-hub:ci

          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3400/health >/dev/null 2>&1 && break
            sleep 1
          done

          curl -fsS http://127.0.0.1:3400/health
          echo

          # The build arg has to reach the binary through ldflags.
          curl -fsS http://127.0.0.1:3400/ | grep -q '"version":"ci"'

          # The unprivileged runtime user has to own the cache volume.
          docker exec cover-ci test -w /data
          echo "container smoke test passed"

      - name: Container logs
        if: failure()
        run: docker logs cover-ci || true

      - name: Clean up
        if: always()
        run: docker rm -fv cover-ci || true

